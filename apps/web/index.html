<!doctype html>
<html lang="es"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#f8f6f1" /><meta name="description" content="Aprende vocabulario inglés con contexto." /><link rel="manifest" href="/manifest.webmanifest" /><title>LexFlow</title>
<script>
// Applies the saved theme before first paint (see src/lib/theme.ts) so the page never flashes the default one.
(function () {
  var theme = null, mode = null;
  try { theme = localStorage.getItem("lexflow.theme"); mode = localStorage.getItem("lexflow.mode"); } catch (error) {}
  if (mode !== "dark" && mode !== "light") mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = theme || "lagoon";
  document.documentElement.dataset.mode = mode;
})();
</script>
</head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
